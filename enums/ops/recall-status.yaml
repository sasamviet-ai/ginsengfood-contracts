version: v1
name: recall-status
title: Recall Status
description: Recall Case v1 status values.
source_documents:
  - docs/documents/2. pack/01-PACK-01-OPERATIONAL-CORE.md
values:
  - value: OPEN
    description: Recall case has been opened.
    source: PACK-01 Recall case concept.
  - value: UNDER_REVIEW
    description: Recall is under review.
    source: PACK-01 review behavior.
  - value: ACTIVE
    description: Recall is active and should drive hold/sale lock as required.
    source: PACK-01 Recall Stop-Sale Path.
  - value: RECOVERY_IN_PROGRESS
    description: Recovery/disposition/CAPA work is in progress.
    source: PACK-01 recovery/disposition/CAPA.
  - value: CLOSED
    description: Recall case is closed after required evidence and sign-off.
    source: PACK-01 recovery evidence/sign-off.
  - value: CANCELLED
    description: Recall case was cancelled before irreversible containment/recovery side effects under the internal cancellation policy.
    source: OD-M13-RCL-STATUS-002 additive external mapping.
  - value: BLOCKED
    description: Derived non-persisted response overlay for a real fail-safe blocker; requires blocked_from_status and non-empty blocking_error_codes.
    source: PACK-01 negative paths and OD-M13-RCL-STATUS-002.
compatibility:
  breaking_change: Closing recall without recovery evidence/sign-off or treating BLOCKED as a persisted internal state is breaking.
  additive_change: CANCELLED is additive but exhaustive-enum consumers must be notified before candidate freeze.
