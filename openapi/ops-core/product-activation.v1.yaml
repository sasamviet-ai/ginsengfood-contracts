openapi: 3.1.0
info:
  title: Ops Core Product Activation API
  version: 1.0.0
  description: Product Activation v1 API contract. Product Activation makes product configuration ready; it does not make SKU sellable.
servers:
  - url: https://api.example.local
    description: Placeholder only.
x-audience-catalog:
  ginsengfood-ops-core-external-bulk-read-v1:
    auth_class: SERVICE_BEARER
    token_use: service
    permission_scope: SERVICE
x-rate-limit-policies:
  ExternalBulkRead:
    sustained_rps_per_principal: 2
    burst_per_principal: 4
    fleet_rps: 10
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    server_timeout_seconds: 10
    queue_limit: 0
    partition_claims: [token_use, sub]
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
x-retry-policies:
  ExternalBulkReadRetry:
    max_retries: 2
    total_budget_seconds: 30
    retryable_statuses: [408, 429, 502, 503, 504]
    honor_retry_after: true
    backoff: FULL_JITTER_BASE_500MS_CAP_5S
paths:
  /v1/product-activations:
    post:
      summary: Create product activation record
      description: "Creates a Product Activation contract record for ops-core control. This is not a sellable mutation; sellable belongs to Operational Core guards. TODO: source documents do not lock the final activation command fields beyond schema."
      operationId: createProductActivationV1
      tags: [product-activation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../schemas/product/product-activation.schema.json"
      responses:
        "201":
          description: Product activation created and wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/product-activation.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/product-activations/{activationId}:
    get:
      summary: Get product activation
      description: Returns one Product Activation record.
      operationId: getProductActivationV1
      tags: [product-activation]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-token-use: service
      x-permission: SKU_ACTIVATION_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - name: activationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Product activation wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/product-activation.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/skus/{skuId}/activation:
    get:
      summary: Get SKU activation state
      description: Returns activation state for a SKU. Consumers must still call sellable/availability APIs before sale or quote.
      operationId: getSkuActivationV1
      tags: [product-activation, sku]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-token-use: service
      x-permission: SKU_ACTIVATION_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - name: skuId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Product activation wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/product-activation.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  schemas:
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error:
              $ref: "../../schemas/common/error.schema.json"
  responses:
    BadRequest: { description: Bad request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Permission denied., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: State conflict or idempotency conflict., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: Validation or guard failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    RateLimited:
      description: RATE_LIMITED; caller must honor Retry-After and the 30-second retry budget.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalServerError: { description: Internal server error., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
