openapi: 3.1.0
info:
  title: Ops Core Recall Sale Lock API
  version: 1.0.0
  description: Recall and Sale Lock v1 API contract. Recall and Sale Lock are high-risk commands and win over product activation, channel, quote, order, and field actions.
servers:
  - url: https://api.example.local
    description: Placeholder only.
paths:
  /v1/recall-cases:
    post:
      summary: Create recall case
      description: Creates a Recall Case through an authenticated high-risk command. The response status is the external projection defined by OD-M13-RCL-STATUS-002; provider-owned ID/status fields are not accepted in the request.
      operationId: createRecallCaseV1
      tags: [recall-sale-lock]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../schemas/ops/recall-case-create-request.schema.json"
      responses:
        "201":
          description: Recall case created and wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/ops/recall-case.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/recall-cases/{recallCaseId}:
    get:
      summary: Get recall case
      description: Returns one Recall Case external projection. BLOCKED is a derived overlay with blocked_from_status and blocking_error_codes; unknown internal state fails closed with CONTRACT_STATUS_UNMAPPED and is never exposed raw.
      operationId: getRecallCaseV1
      tags: [recall-sale-lock]
      parameters:
        - name: recallCaseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recall case wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/ops/recall-case.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/sale-locks:
    post:
      summary: Create sale lock
      description: Creates a durable Sale Lock / Stop Sale contract record for SKU, BATCH, LOT, or TRACE_CHAIN only. All identifiers are UUIDs; TRACE_CHAIN uses scope_id equal to recall_case_id and covers the complete versioned historical impact union for that case. Unsupported or mismatched scope fails validation before side effects. Per OD-RCL-03, every successful durable activation enqueues both ops-core.recall.sale-lock-activated.v1 and ops-core.recall.stop-sale-required.v1 for the same scope in the same outbox transaction; Recall Case creation alone does not emit stop-sale.
      operationId: createSaleLockV1
      tags: [recall-sale-lock]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../schemas/ops/sale-lock-create-request.schema.json"
      responses:
        "201":
          description: Sale lock created and wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/ops/sale-lock.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/sale-locks/{saleLockId}:
    get:
      summary: Get sale lock
      description: Returns one Sale Lock record. ACTIVE remains authoritative until an approved release is effective; consumers must not infer commerce availability from a release request.
      operationId: getSaleLockV1
      tags: [recall-sale-lock]
      parameters:
        - name: saleLockId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sale lock wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/ops/sale-lock.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Stable client-generated idempotency key for the high-risk command.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error:
              $ref: "../../schemas/common/error.schema.json"
  responses:
    BadRequest: { description: Bad request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Permission denied., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: State conflict or idempotency conflict., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: Validation or guard failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    InternalServerError: { description: Internal server error., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
