openapi: 3.1.0
info:
  title: Ops Core Service Authentication API
  version: 1.0.0
  description: >-
    Client-credentials bootstrap for approved machine consumers of ops-core root /v1 APIs.
    The endpoint issues a short-lived bearer token, never a user/admin session, and does not
    expose a refresh token. Unknown clients, invalid secrets, disabled/expired credentials,
    and principals without an allowed service permission all return the same INVALID_CLIENT
    response to prevent credential and permission enumeration.
servers:
  - url: https://api.example.local
    description: Placeholder only.
x-audience-catalog:
  NONE:
    auth_class: ANONYMOUS_BOOTSTRAP
    token_use: NONE
    permission_scope: NONE
x-rate-limit-policies:
  AuthSensitive:
    permit_limit: 10
    window_seconds: 60
    queue_limit: 0
    partition: VERIFIED_REMOTE_IP
x-retry-policies:
  AuthSensitiveNoRetry:
    max_retries: 0
    total_budget_seconds: 0
    honor_retry_after: true
paths:
  /v1/service-tokens:
    post:
      summary: Issue a short-lived service access token
      description: >-
        Exchanges an approved service principal client_id and client_secret for a bearer token
        used on authorized root /v1 adapters such as POST /v1/availability/check. The request is
        anonymous by necessity, protected by an authentication-sensitive rate limit, and must be
        sent as application/json. The client_secret and the access token must never be written to a log or to
        disk. The access token may be kept in the consumer's process memory and reused until shortly before its
        expires_in elapses (the Cache-Control: no-store header forbids HTTP-layer caching, not in-memory reuse);
        a consumer that asked for a new token on every call would meet the AuthSensitive limit of 10 requests
        per minute per verified remote IP. The lifetime is provider configuration (15 minutes by default), so
        read expires_in and never assume it. A 401 on a /v1 operation means the token is no longer valid
        (expired, or its credential was revoked): drop it and ask for a new one, at most once per call.

        The request carries only client_id and client_secret: there is no audience, scope or permission
        parameter. The principal decides what the token can do. The permissions granted to it decide the
        audiences (aud) the token carries, and every operation requires its own x-audience and its own
        x-permission, answering 403 FORBIDDEN when either is missing. SELLABLE_CHECK or SELLABLE_STATUS_VIEW
        adds the availability audience; any permission of the snapshot reads (for example SKU_CATALOG_VIEW,
        INVENTORY_BALANCE_VIEW, INVENTORY_ALLOCATION_VIEW, WAREHOUSE_VIEW) adds the bulk-read audience;
        INVENTORY_ALLOCATION_CREATE is the only permission that adds the allocation audience, so a token
        that can read stock cannot hold it. The three audiences and the ten permissions of the M3 sales
        principal are listed in docs/m3-allocation-integration-notes.md, section 6.
      operationId: issueServiceTokenV1
      tags: [service-auth]
      security: []
      x-auth-class: ANONYMOUS_BOOTSTRAP
      x-audience: NONE
      x-token-use: NONE
      x-permission: NONE
      x-permission-scope: NONE
      x-rate-limit-policy: AuthSensitive
      x-retry-policy: AuthSensitiveNoRetry
      x-idempotency-disposition: NOT_APPLICABLE_CONFIDENTIAL_CLIENT_EXCHANGE
      x-runtime-policy: "CURRENT_SOURCE_ROUTE_REQUIRES_EXACT_PARITY; AUTH_SENSITIVE_RATE_POLICY_MATCHED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTokenRequest"
      responses:
        "200":
          description: Short-lived service bearer token. No refresh token is issued.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
            Cache-Control:
              description: Token responses are never cacheable.
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidClient"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  headers:
    CorrelationId:
      description: >-
        The correlation id in effect for this request: the X-Correlation-Id of the request when it was valid, otherwise a UUID
        generated by the provider. Compare it with the one you sent before assuming it is yours.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9:_.-]{1,128}$" }
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Optional trace id: 1 to 128 characters of A-Z, a-z, 0-9, colon, underscore, dot and hyphen, counted after leading and
        trailing white space is trimmed. Absent, empty or malformed is not an error: the provider ignores the value, generates
        a UUID and uses that one, and the request is processed normally. The id in effect always comes back, in the
        X-Correlation-Id response header and in correlation.correlationId of the response body (error.correlationId of an
        error body); a consumer that sent a valid id gets the same id back, so compare it before assuming it is yours. Put
        nothing secret or personal in it. The same rule is in docs/correlation-audit-standard.md. The 200 answer of POST
        /v1/service-tokens is a bare OAuth-style body without an envelope, so there the id comes back in the response header
        only (header only, no correlation block); its errors keep the envelope.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9:_.-]{1,128}$" }
  schemas:
    ServiceTokenRequest:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: string
          minLength: 1
          description: Approved ops-core service principal code.
        client_secret:
          type: string
          minLength: 1
          writeOnly: true
          description: Service credential secret. Never log, persist in plaintext, or echo it.
      required: [client_id, client_secret]
    ServiceTokenResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 1
          description: Short-lived JWT bearer for the service principal's allowed root /v1 permissions.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
          description: Remaining lifetime in seconds at issuance.
        expires_at:
          type: string
          format: date-time
      required: [access_token, token_type, expires_in, expires_at]
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error:
              $ref: "../../schemas/common/error.schema.json"
  responses:
    BadRequest:
      description: Malformed JSON request. Missing or invalid credentials use the generic 401 response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InvalidClient:
      description: >-
        Generic INVALID_CLIENT response for every credential, principal-status, expiry, or
        allowed-permission failure. The response must not reveal which check failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnsupportedMediaType:
      description: Request Content-Type is not application/json.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooManyRequests:
      description: Authentication-sensitive rate limit exceeded.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalServerError:
      description: Internal server error with no credential or token disclosure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
