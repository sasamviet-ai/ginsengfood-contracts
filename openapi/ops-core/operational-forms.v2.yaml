      summary: Create preprocessing log form
      operationId: createPreprocessingLogFormV2
      tags: [operational-forms]
      x-operational-form-key: PREPROCESSING_LOG
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PreprocessingLogCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/freezing-log:
    post:
      summary: Create freezing log form
      operationId: createFreezingLogFormV2
      tags: [operational-forms]
      x-operational-form-key: FREEZING_LOG
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/FreezingLogCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/freeze-drying-log:
    post:
      summary: Create freeze-drying log form
      operationId: createFreezeDryingLogFormV2
      tags: [operational-forms]
      x-operational-form-key: FREEZE_DRYING_LOG
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/FreezeDryingLogCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/packing-level-1:
    post:
      summary: Create packaging level 1 log form
      operationId: createPackagingLevel1LogFormV2
      tags: [operational-forms]
      x-operational-form-key: PACKAGING_LEVEL1_LOG
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PackagingLevel1LogCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/packing-level-2:
    post:
      summary: Create packaging level 2 log form
      operationId: createPackagingLevel2LogFormV2
      tags: [operational-forms]
      x-operational-form-key: PACKAGING_LEVEL2_LOG
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PackagingLevel2LogCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/packing-level-3:
    post:
      summary: Create packaging level 3 log form
      operationId: createPackagingLevel3LogFormV2
      tags: [operational-forms]
      x-operational-form-key: PACKAGING_LEVEL3_LOG
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PackagingLevel3LogCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/finished-goods-qc:
    post:
      summary: Create finished goods QC form
      operationId: createFinishedGoodsQcFormV2
      tags: [operational-forms]
      x-operational-form-key: FINISHED_GOODS_QC
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/FinishedGoodsQcCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/finished-goods-receipts:
    post:
      summary: Create finished goods receipt form
      operationId: createFinishedGoodsReceiptFormV2
      tags: [operational-forms]
      x-operational-form-key: FINISHED_GOODS_RECEIPT
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/FinishedGoodsReceiptCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/material-issue-accounting:
    post:
      summary: Create material issue accounting form
      operationId: createMaterialIssueAccountingFormV2
      tags: [operational-forms]
      x-operational-form-key: MATERIAL_ISSUE_ACCOUNTING
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/MaterialIssueAccountingCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/forms/{formId}/status:
    patch:
      summary: Update operational form status
      operationId: updateOperationalFormStatusV2
      tags: [operational-forms]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: formId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string }
                actor: { $ref: "../../schemas/common/actor.schema.json" }
                evidence_refs:
                  type: array
                  items: { $ref: "../../schemas/common/evidence-ref.schema.json" }
              required: [status, actor]
      responses: { "200": { $ref: "#/components/responses/OperationalFormOk" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/operational-forms/{formId}:
    get:
      summary: Get operational form
      operationId: getOperationalFormV2
      tags: [operational-forms]
      parameters:
        - name: formId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses: { "200": { $ref: "#/components/responses/OperationalFormOk" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
components:
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Stable client-generated idempotency key for the command. Recommended format <surface>:<actionCode>:<clientUuid>. Replaying the same key with the same payload returns the original result instead of creating a duplicate.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  requestBodies:
    MaterialIntakeCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MaterialIntakeCreate" }
    ProductionOrderCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProductionOrderCreate" }
    MaterialIssueRequestCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MaterialIssueRequestCreate" }
    MaterialReleaseApprovalCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MaterialReleaseApprovalCreate" }
    PersonnelAttendanceCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PersonnelAttendanceCreate" }
    PreprocessingLogCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PreprocessingLogCreate" }
    FreezingLogCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FreezingLogCreate" }
    FreezeDryingLogCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FreezeDryingLogCreate" }
    PackagingLevel1LogCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PackagingLevel1LogCreate" }
    PackagingLevel2LogCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PackagingLevel2LogCreate" }
    PackagingLevel3LogCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PackagingLevel3LogCreate" }
    FinishedGoodsQcCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinishedGoodsQcCreate" }
    FinishedGoodsReceiptCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinishedGoodsReceiptCreate" }
    MaterialIssueAccountingCreate:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MaterialIssueAccountingCreate" }
  schemas:
    OperationalFormCreateBase:
      $ref: "../../schemas/ops/operational-form-create-request.v2.schema.json"
    MaterialIntakeCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: MATERIAL_INTAKE } } }]
    ProductionOrderCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: PRODUCTION_ORDER } } }]
    MaterialIssueRequestCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: MATERIAL_ISSUE_REQUEST } } }]
    MaterialReleaseApprovalCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: MATERIAL_RELEASE_APPROVAL } } }]
    PersonnelAttendanceCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: PERSONNEL_ATTENDANCE } } }]
    PreprocessingLogCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: PREPROCESSING_LOG } } }]
    FreezingLogCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: FREEZING_LOG } } }]
    FreezeDryingLogCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: FREEZE_DRYING_LOG } } }]
    PackagingLevel1LogCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: PACKAGING_LEVEL1_LOG } } }]
    PackagingLevel2LogCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: PACKAGING_LEVEL2_LOG } } }]
    PackagingLevel3LogCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: PACKAGING_LEVEL3_LOG } } }]
    FinishedGoodsQcCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: FINISHED_GOODS_QC } } }]
    FinishedGoodsReceiptCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: FINISHED_GOODS_RECEIPT } } }]
    MaterialIssueAccountingCreate:
      allOf: [{ $ref: "#/components/schemas/OperationalFormCreateBase" }, { type: object, properties: { form_key: { const: MATERIAL_ISSUE_ACCOUNTING } } }]
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error: { $ref: "../../schemas/common/error.schema.json" }
  responses:
    OperationalFormCreated:
      description: Operational form created and wrapped in the common envelope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../schemas/common/envelope.schema.json"
              - type: object
                properties:
                  data: { $ref: "../../schemas/ops/operational-form.v2.schema.json" }
    OperationalFormOk:
      description: Operational form wrapped in the common envelope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../schemas/common/envelope.schema.json"
              - type: object
                properties:
                  data: { $ref: "../../schemas/ops/operational-form.v2.schema.json" }
    BadRequest: { description: Bad request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Permission denied., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: State conflict or idempotency conflict., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: "Validation, mapping, permission, evidence, or guard failure.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    InternalServerError: { description: Internal server error., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
