openapi: 3.1.0
info:
  title: Ops Core Operational Forms API
  version: 2.0.0
  description: Operational Form v2 contract. form_key is the canonical, order-independent identity; legacy code/type fields are not part of the v2 wire format. The shared create vocabulary contains every active key, while this file exposes only the explicitly listed source-specific create operations. This file versions only Operational Forms and does not major-version print, MISA sync, or material-planning APIs.
servers:
  - url: https://api.example.local
    description: Placeholder only.
tags:
  - name: operational-forms
paths:
  /v2/admin/operational/raw-material-inbound:
    post:
      summary: Create material intake form
      operationId: createMaterialIntakeFormV2
      tags: [operational-forms]
      x-operational-form-key: MATERIAL_INTAKE
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/MaterialIntakeCreate"
      responses: { "201": { $ref: "#/components/responses/OperationalFormCreated" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" }, "500": { $ref: "#/components/responses/InternalServerError" } }
  /v2/admin/operational/production-orders:
    post:
      summary: Create production order form
      operationId: createProductionOrderFormV2
      tags: [operational-forms]
      x-operational-form-key: PRODUCTION_ORDER
