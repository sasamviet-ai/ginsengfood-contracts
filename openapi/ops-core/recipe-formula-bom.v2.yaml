openapi: 3.1.0
info:
  title: Ops Core Recipe and Formula API v2 Contract Candidate
  version: 2.0.0
  description: Contract-only candidate for Recipe and Formula Version reads using the canonical ops-core lifecycle vocabulary. Runtime registration, auth/audience policy, and consumer cutover are not approved by this artifact.
  x-owner-decision: OD-B9-FORMULA-STATUS-001
  x-runtime-status: CONTRACT_ONLY
  x-auth-status: BLOCKED_BY_X04
servers:
  - url: https://api.example.local
    description: Placeholder only; no v2 runtime deployment is asserted.
paths:
  /v2/recipes/{recipeId}:
    get:
      summary: Get recipe v2 contract projection
      description: Returns the canonical lifecycle and formula kind as separate fields. Readiness, usage lock, supersession, and guard outcomes are not inferred.
      operationId: getRecipeV2
      tags: [recipe-formula]
      x-owner-decision: OD-B9-FORMULA-STATUS-001
      x-runtime-status: CONTRACT_ONLY
      x-auth-status: BLOCKED_BY_X04
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Recipe v2 wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/recipe.v2.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v2/formula-versions/{formulaVersionId}:
    get:
      summary: Get formula version v2 contract projection
      description: Returns the canonical lifecycle and formula kind as separate fields. Readiness, usage lock, supersession, and guard outcomes are not inferred.
      operationId: getFormulaVersionV2
      tags: [recipe-formula]
      x-owner-decision: OD-B9-FORMULA-STATUS-001
      x-runtime-status: CONTRACT_ONLY
      x-auth-status: BLOCKED_BY_X04
      parameters:
        - name: formulaVersionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Formula Version v2 wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/formula-version.v2.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  schemas:
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error:
              $ref: "../../schemas/common/error.schema.json"
  responses:
    BadRequest: { description: Bad request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Permission denied., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: State conflict or idempotency conflict., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: Validation or guard failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    InternalServerError: { description: Internal server error., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
