openapi: 3.1.0
info:
  title: Ops Core SKU API
  version: 1.0.0
  description: SKU v1 API contract for internal SKU records, public SKU projection, and operational status. Product Activation is not sellable.
servers:
  - url: https://api.example.local
    description: Placeholder only.
x-owner-decision-ref: OWNER-DIRECTIVE-2026-09-03-EXT-OD-01-07
x-audience-catalog:
  ginsengfood-ops-core-external-bulk-read-v1:
    auth_class: SERVICE_BEARER
    token_use: service
    permission_scope: SERVICE
x-rate-limit-policies:
  ExternalBulkRead:
    sustained_rps_per_principal: 2
    burst_per_principal: 4
    fleet_rps: 10
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    server_timeout_seconds: 10
    queue_limit: 0
    partition_claims: [token_use, sub]
    required_token_use: service
    principal_sub_format: uuid
    limiter_authority: DISTRIBUTED_INGRESS_TOKEN_BUCKET
    in_process_limiter: DEFENSE_IN_DEPTH_ONLY
    pre_auth_partition: TRUSTED_PROXY_VERIFIED_IP_ONLY
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
    exhausted_or_unavailable_behavior: FAIL_CLOSED_NO_CACHED_PASS
x-retry-policies:
  ExternalBulkReadRetry:
    max_retries: 2
    total_budget_seconds: 30
    retryable_statuses: [408, 429, 502, 503, 504]
    non_retryable_statuses: [400, 401, 403, 404, 409, 410, 422, 500]
    honor_retry_after: true
    backoff: FULL_JITTER_BASE_500MS_CAP_5S
x-pagination-policies:
  ExternalSnapshotCursorV1:
    description: >-
      Policy of the full-snapshot cursor shared by the bulk-read lists of this file. "delta" in the keys below
      (delta_supported, delta_replay_retention_seconds, delta_poll_seconds, delta_poll_jitter_percent,
      future_tombstone_retention_seconds) names a change feed that returns only what changed since a checkpoint; no list of this
      contract publishes one, so delta_supported is false and the other delta_* keys describe something that does not exist.
      GET /v1/skus?updated_since= is NOT a delta feed: it is a filter on the instant a SKU was written, applied to a complete
      snapshot of that moment; it keeps no checkpoint at the provider, replays nothing and publishes no tombstone (a SKU never
      disappears: RETIRED stays listed). expired_cursor_recovery means that an expired cursor (410) or a snapshot that changed
      under a cursor (409) is recovered by reading the whole snapshot again from the first page, never by resuming from a
      timestamp or a local checkpoint of the cursor; that rule is about CURSORS and is not a ban on updated_since as a filter for a
      new pull. snapshot_refresh_seconds and full_reconciliation_seconds are the generic cadence of the stock and warehouse
      feeds; for the SKU list follow the recommendation of listSkusV1 and docs/m3-sku-catalog-integration-notes.md section 1.
    mode: OPAQUE_SCOPE_BOUND_SNAPSHOT_CURSOR
    cursor_version: 1
    cursor_ttl_seconds: 1800
    cursor_ttl_mode: ABSOLUTE_NON_SLIDING
    integrity_protected: true
    default_limit: 50
    max_limit: 100
    page_max_items: 100
    page_item_count_semantics: EXACT_CURRENT_PAGE_DATA_LENGTH
    item_count_semantics: EXACT_FULL_SNAPSHOT_TOTAL
    delivered_item_count_semantics: CUMULATIVE_THROUGH_CURRENT_PAGE
    complete_requires: DELIVERED_COUNT_EQUALS_ITEM_COUNT_AND_NEXT_CURSOR_NULL
    manifest_version: 1
    manifest_algorithm: SHA-256
    manifest_canonicalization: JCS_RFC8785
    manifest_document_fields: [manifest_version, resource, snapshot_id, as_of, high_watermark, item_count, items]
    manifest_items_semantics: COMPLETE_STABLE_SORTED_SNAPSHOT
    verify_manifest_before_absence_reconcile: true
    delta_supported: false
    delta_replay_retention_seconds: 604800
    delta_poll_seconds: 30
    delta_poll_jitter_percent: 20
    future_tombstone_retention_seconds: 7776000
    snapshot_refresh_seconds: 300
    full_reconciliation_seconds: 21600
    full_reconciliation_triggers: [STARTUP, RESUME, CHANGE_FEED_GAP, CURSOR_EXPIRED]
    gap_reconcile_start_within_seconds: 60
    cursor_bindings: [operation, resource, filters, sort, scope, principal, snapshot, high_watermark]
    gap_recovery: FAIL_CLOSED_FULL_RECONCILE
    expired_cursor_recovery: FULL_RECONCILE_NO_TIMESTAMP_OR_LOCAL_CHECKPOINT
    absence_reconcile_requires: FULL_SNAPSHOT_COMPLETE_VERIFIED_MANIFEST_COUNT_HASH
paths:
  /v1/skus:
    get:
      summary: List SKUs
      description: >-
        Lists every SKU the caller may read, so a consumer discovers a SKU created, activated, retired or
        re-packaged in ops-core without knowing its sku_id first. Each item is the same SkuV1Response that
        getSkuV1 returns for that SKU, including updated_at, revision and sellable_uoms.
        Pagination is the opaque full-snapshot cursor of the other external list reads (no offset, no page
        number): the first page has no cursor, the response meta carries next_cursor until complete is true, and
        the cursor is bound to the exact limit and filter set that issued it. Order is stable, updated_at
        ascending then sku_id ascending, so SKUs that share an updated_at never swap places between pages or
        between reads. To read incrementally, pass updated_since = the largest updated_at already processed minus
        a safety margin, for example 5 minutes. updated_at is the instant the change was WRITTEN, not the instant
        it was COMMITTED: a transaction that started earlier and commits later carries an updated_at older than a
        value the consumer has already stored, and a read that starts exactly at that value would never return
        it. The filter is inclusive (updated_at greater than or equal to the value), so the SKUs that share the
        boundary instant, and every SKU inside the margin, come again and the consumer deduplicates by sku_id and
        revision. No margin is a guarantee, so a consumer must also read the whole catalog, without updated_since,
        at a fixed interval and treat that read as the authority.

        Recommended cadence (SHOULD, not a guarantee; the numbers are a recommendation for the SKU list and the provider
        does not enforce them): pull incrementally every 5 minutes with updated_since = the time of the previous
        successful pull minus 5 minutes; read the whole catalog, without updated_since, at start-up and at least every
        24 hours (19 SKUs today, one page, so it is cheap); when a cursor expires (410) or the snapshot changes under it
        (409), read the whole catalog again from the first page. The x-pagination-policy below and x-delta-supported: false
        describe the generic snapshot feed: updated_since on this operation is a filter on the write instant of a snapshot,
        not a delta feed. Without updated_since the whole catalog is returned. INACTIVE and RETIRED SKUs are listed: they are lifecycle
        states, not deletions, and a SKU never disappears from the list. lifecycle_status filters on the value
        the object publishes (ACTIVE_BASELINE is internal and is published, and filtered, as ACTIVE); the
        provider currently publishes only ACTIVE, INACTIVE and RETIRED, so any other value of the closed enum
        answers an empty page, not an error. GET /v1/skus never hides a SKU by its status; it filters only when
        lifecycle_status is sent. The database stores four states (ACTIVE_BASELINE, ACTIVE, INACTIVE and RETIRED), so the four
        stored states are the whole story; DRAFT, PENDING_READINESS and BLOCKED seen in the ops-core code are statuses of the
        product activation, not of the SKU lifecycle (docs/m3-sku-catalog-integration-notes.md sections 2 and 3). A parameter that is unknown, repeated or malformed (limit outside
        1..100, lifecycle_status outside the enum, updated_since without a time zone) answers 422 and never
        widens the result. Same envelope, errors, audience, permission and rate bucket as getSkuV1.
      operationId: listSkusV1
      tags: [sku]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: SKU_CATALOG_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "updatedAt ASC, skuId ASC"
      x-tombstone-policy: RETIRED_LIFECYCLE_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: lifecycle_status
          in: query
          required: false
          description: Only SKUs whose published lifecycle_status equals this value. Sent at most once.
          schema: { type: string, enum: [DRAFT, PENDING_CONFIG, PENDING_EVIDENCE, READY, ACTIVE, INACTIVE, RETIRED, BLOCKED] }
        - name: updated_since
          in: query
          required: false
          description: >-
            Only SKUs whose updated_at is greater than or equal to this instant. ISO-8601 date-time WITH a time
            zone (Z or a numeric offset); a value without one answers 422. Sent at most once. updated_at is the
            instant the change was WRITTEN, not the instant it was COMMITTED, so overlap the boundary (for example
            5 minutes before the largest updated_at already processed) and re-read the whole catalog periodically.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Stable SKU snapshot page; an empty result returns data=[] with complete=true.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/product/sku.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/ExternalUnauthorized" }
        "403": { $ref: "#/components/responses/ExternalForbidden" }
        "404": { $ref: "#/components/responses/ExternalNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/ExternalUnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ExternalInternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/skus/{skuId}:
    get:
      summary: Get SKU
      description: Returns internal SKU contract data for ops-core frontend and authorized internal consumers.
      operationId: getSkuV1
      tags: [sku]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-token-use: service
      x-permission: SKU_CATALOG_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - $ref: "#/components/parameters/SkuId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: SKU wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/sku.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/skus/{skuId}/public:
    get:
      summary: Get public SKU projection
      description: Returns the protected, public-safe SKU projection. Must not expose recipe, formula, supplier, QC internals, cost, or private operational data; BOM, source, evidence, internal codes, and governance metadata are also excluded. The public path name does not make this operation anonymous.
      operationId: getPublicSkuV1
      tags: [sku]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: PRODUCT_PUBLIC_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: OD-A6-05
      parameters:
        - $ref: "#/components/parameters/SkuId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Public-safe SKU payload wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data]
                    properties:
                      data:
                        $ref: "../../schemas/ops/x03b/external-public-product.schema.json"
        "400": { $ref: "#/components/responses/ExternalBadRequest" }
        "401": { $ref: "#/components/responses/ExternalUnauthorized" }
        "403": { $ref: "#/components/responses/ExternalForbidden" }
        "404": { $ref: "#/components/responses/ExternalNotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "422": { $ref: "#/components/responses/ExternalUnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ExternalInternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/skus/{skuId}/operational-status:
    get:
      summary: Get SKU operational status
      description: Returns the ops-core operational sellable status for a SKU. Business-platform may read this status but must not mutate ops-core truth.
      operationId: getSkuOperationalStatusV1
      tags: [sku, availability-sellable]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-token-use: service
      x-permission: SELLABLE_STATUS_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - $ref: "#/components/parameters/SkuId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Sellable status wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/ops/sellable-status.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  headers:
    CorrelationId:
      description: >-
        The correlation id in effect for this request: the X-Correlation-Id of the request when it was valid, otherwise a UUID
        generated by the provider. Compare it with the one you sent before assuming it is yours.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9:_.-]{1,128}$" }
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Optional trace id: 1 to 128 characters of A-Z, a-z, 0-9, colon, underscore, dot and hyphen, counted after leading and
        trailing white space is trimmed. Absent, empty or malformed is not an error: the provider ignores the value, generates
        a UUID and uses that one, and the request is processed normally. The id in effect always comes back, in the
        X-Correlation-Id response header and in correlation.correlationId of the response body (error.correlationId of an
        error body); a consumer that sent a valid id gets the same id back, so compare it before assuming it is yours. Put
        nothing secret or personal in it. The same rule is in docs/correlation-audit-standard.md.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9:_.-]{1,128}$" }
    SkuId:
      name: skuId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque server-issued cursor bound to operation, filters, scope, principal, snapshot, and high-watermark. Omit on first page.
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error:
              $ref: "../../schemas/common/error.schema.json"
  responses:
    BadRequest: { description: Bad request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Permission denied., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: State conflict or idempotency conflict., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: Validation or guard failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    InternalServerError: { description: Internal server error., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    CursorInvalid:
      description: CURSOR_INVALID for malformed, tampered, or wrong-scope cursor.
      x-error-code: CURSOR_INVALID
      x-http-status: 400
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/CursorInvalid" } } }
    ChangeFeedGap:
      description: CHANGE_FEED_GAP; discard the partial page and start fail-closed full reconciliation.
      x-error-code: CHANGE_FEED_GAP
      x-http-status: 409
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/ChangeFeedGap" } } }
    CursorExpired:
      description: CURSOR_EXPIRED after the absolute 30-minute TTL; restart full reconciliation.
      x-error-code: CURSOR_EXPIRED
      x-http-status: 410
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/CursorExpired" } } }
    ExternalBadRequest:
      description: Malformed path or query input.
      x-error-code: INVALID_REQUEST
      x-http-status: 400
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/InvalidRequest" } } }
    ExternalUnauthorized:
      description: Safe authentication failure.
      x-error-code: UNAUTHORIZED
      x-http-status: 401
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/Unauthorized" } } }
    ExternalForbidden:
      description: Required operation permission or SERVICE scope is missing.
      x-error-code: FORBIDDEN
      x-http-status: 403
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/Forbidden" } } }
    ExternalNotFound:
      description: Requested SKU or public Product content is not found or inaccessible.
      x-error-code: NOT_FOUND
      x-http-status: 404
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/NotFound" } } }
    RequestTimeout:
      description: Request timed out before a safe projection was returned.
      x-error-code: REQUEST_TIMEOUT
      x-http-status: 408
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/RequestTimeout" } } }
    ExternalUnprocessableEntity:
      description: Path/query validation or guard failure.
      x-error-code: VALIDATION_FAILED
      x-http-status: 422
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/ValidationFailed" } } }
    TooManyRequests:
      description: RATE_LIMITED; caller must honor Retry-After and the 30-second total retry budget.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After: { required: true, schema: { type: integer, minimum: 1 } }
        X-RateLimit-Limit: { required: true, schema: { type: integer, const: 2 } }
        X-RateLimit-Remaining: { required: true, schema: { type: integer, minimum: 0 } }
        X-RateLimit-Reset: { required: true, schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/RateLimited" } } }
    ExternalInternalServerError:
      description: Safe internal error without stack trace or partition key.
      x-error-code: INTERNAL_ERROR
      x-http-status: 500
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/InternalError" } } }
    BadGateway:
      description: Upstream bad gateway; retry only within ExternalBulkReadRetry.
      x-error-code: BAD_GATEWAY
      x-http-status: 502
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/BadGateway" } } }
    ServiceUnavailable:
      description: Service unavailable; retry only within ExternalBulkReadRetry.
      x-error-code: SERVICE_UNAVAILABLE
      x-http-status: 503
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/ServiceUnavailable" } } }
    GatewayTimeout:
      description: Gateway timeout; retry only within ExternalBulkReadRetry.
      x-error-code: GATEWAY_TIMEOUT
      x-http-status: 504
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/GatewayTimeout" } } }
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
