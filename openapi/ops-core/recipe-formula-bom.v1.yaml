openapi: 3.1.0
info:
  title: Ops Core Recipe Formula BOM API
  version: 1.0.0
  description: Recipe, Formula Version, and BOM v1 API contract. Formula data is contract/reference data only, not production formula logic.
servers:
  - url: https://api.example.local
    description: Placeholder only.
x-audience-catalog:
  ginsengfood-ops-core-external-bulk-read-v1:
    auth_class: SERVICE_BEARER
    token_use: service
    permission_scope: SERVICE
x-rate-limit-policies:
  ExternalBulkRead:
    sustained_rps_per_principal: 2
    burst_per_principal: 4
    fleet_rps: 10
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    server_timeout_seconds: 10
    queue_limit: 0
    partition_claims: [token_use, sub]
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
x-retry-policies:
  ExternalBulkReadRetry:
    max_retries: 2
    total_budget_seconds: 30
    retryable_statuses: [408, 429, 502, 503, 504]
    honor_retry_after: true
    backoff: FULL_JITTER_BASE_500MS_CAP_5S
paths:
  /v1/recipes/{recipeId}:
    get:
      summary: Get recipe
      description: "Returns one recipe. TODO: source documents do not define public/internal projections for recipe details."
      operationId: getRecipeV1
      deprecated: true
      x-superseded-by: recipe-formula-bom.v2.yaml#getRecipeV2
      tags: [recipe-formula-bom]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-token-use: service
      x-permission: RECIPE_PRODUCTION_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Recipe wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/recipe.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/formula-versions/{formulaVersionId}:
    get:
      summary: Get formula version
      description: Returns G0/G1/versioned formula contract data, including anchor rice and ratio references when present in schema.
      operationId: getFormulaVersionV1
      deprecated: true
      x-superseded-by: recipe-formula-bom.v2.yaml#getFormulaVersionV2
      tags: [recipe-formula-bom]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-token-use: service
      x-permission: RECIPE_PRODUCTION_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - name: formulaVersionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Formula version wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/formula-version.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/boms/{bomId}:
    get:
      summary: Get BOM
      description: Returns BOM contract data. Production must snapshot BOM separately; this endpoint does not mutate production snapshots.
      operationId: getBomV1
      tags: [recipe-formula-bom]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-token-use: service
      x-permission: RECIPE_PRODUCTION_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - name: bomId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: BOM wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/product/bom.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  schemas:
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error:
              $ref: "../../schemas/common/error.schema.json"
  responses:
    BadRequest: { description: Bad request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Permission denied., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: State conflict or idempotency conflict., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: Validation or guard failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    RateLimited:
      description: RATE_LIMITED; caller must honor Retry-After and the 30-second retry budget.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalServerError: { description: Internal server error., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
