openapi: 3.1.0
info:
  title: Ops Core Inventory API
  version: 1.0.0
  description: >-
    Protected external inventory read facades. Every operation is read-only, uses a dedicated
    response whitelist, and must not mutate inventory truth. Collection reads use opaque,
    scope-bound full-snapshot cursors; delta feeds are not published in v1.
servers:
  - url: https://api.example.local
    description: Placeholder only.
x-owner-decision-ref: OWNER-DIRECTIVE-2026-09-03-EXT-OD-01-07
x-rate-limit-policies:
  ExternalBulkRead:
    sustained_rps_per_principal: 2
    burst_per_principal: 4
    fleet_rps: 10
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    server_timeout_seconds: 10
    queue_limit: 0
    partition_claims: [token_use, sub]
    required_token_use: service
    principal_sub_format: uuid
    limiter_authority: DISTRIBUTED_INGRESS_TOKEN_BUCKET
    in_process_limiter: DEFENSE_IN_DEPTH_ONLY
    pre_auth_partition: TRUSTED_PROXY_VERIFIED_IP_ONLY
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
    exhausted_or_unavailable_behavior: FAIL_CLOSED_NO_CACHED_PASS
x-retry-policies:
  ExternalBulkReadRetry:
    max_retries: 2
    total_budget_seconds: 30
    retryable_statuses: [408, 429, 502, 503, 504]
    non_retryable_statuses: [400, 401, 403, 404, 409, 410, 422, 500]
    honor_retry_after: true
    backoff: FULL_JITTER_BASE_500MS_CAP_5S
x-pagination-policies:
  ExternalSnapshotCursorV1:
    mode: OPAQUE_SCOPE_BOUND_SNAPSHOT_CURSOR
    cursor_version: 1
    cursor_ttl_seconds: 1800
    cursor_ttl_mode: ABSOLUTE_NON_SLIDING
    integrity_protected: true
    default_limit: 50
    max_limit: 100
    page_max_items: 100
    page_item_count_semantics: EXACT_CURRENT_PAGE_DATA_LENGTH
    item_count_semantics: EXACT_FULL_SNAPSHOT_TOTAL
    delivered_item_count_semantics: CUMULATIVE_THROUGH_CURRENT_PAGE
    complete_requires: DELIVERED_COUNT_EQUALS_ITEM_COUNT_AND_NEXT_CURSOR_NULL
    manifest_version: 1
    manifest_algorithm: SHA-256
    manifest_canonicalization: JCS_RFC8785
    manifest_document_fields: [manifest_version, resource, snapshot_id, as_of, high_watermark, item_count, items]
    manifest_items_semantics: COMPLETE_STABLE_SORTED_SNAPSHOT
    verify_manifest_before_absence_reconcile: true
    delta_supported: false
    delta_replay_retention_seconds: 604800
    delta_poll_seconds: 30
    delta_poll_jitter_percent: 20
    future_tombstone_retention_seconds: 7776000
    snapshot_refresh_seconds: 300
    full_reconciliation_seconds: 21600
    full_reconciliation_triggers: [STARTUP, RESUME, CHANGE_FEED_GAP, CURSOR_EXPIRED]
    gap_reconcile_start_within_seconds: 60
    cursor_bindings: [operation, resource, filters, sort, scope, principal, snapshot, high_watermark]
    gap_recovery: FAIL_CLOSED_FULL_RECONCILE
    expired_cursor_recovery: FULL_RECONCILE_NO_TIMESTAMP_OR_LOCAL_CHECKPOINT
    absence_reconcile_requires: FULL_SNAPSHOT_COMPLETE_VERIFIED_MANIFEST_COUNT_HASH
paths:
  /v1/inventory/stock-balances:
    get:
      summary: List external stock balance projections
      description: Returns a derived, read-only stock snapshot. This snapshot is not final sell authority and cannot be used to mutate the ledger.
      operationId: listStockBalancesV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: INVENTORY_BALANCE_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "stockBalanceId ASC"
      x-tombstone-policy: SNAPSHOT_ONLY_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: skuId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: materialId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: itemType
          in: query
          required: false
          schema: { type: string, enum: [MATERIAL, PACKAGING, FINISHED_GOOD] }
      responses:
        "200":
          description: Stable stock-balance snapshot page; empty snapshots return data=[] with complete=true.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/ops/x03b/external-stock-balance.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/inventory/ledger:
    get:
      summary: List external inventory ledger entries
      description: Returns append-only ledger projections. The route has no mutation, delete, or tombstone behavior.
      operationId: listInventoryLedgerV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: INVENTORY_LEDGER_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "occurredAt ASC, ledgerEntryId ASC"
      x-tombstone-policy: APPEND_ONLY_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Stable append-only ledger snapshot page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/ops/x03b/external-inventory-ledger-entry.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/inventory/stock-alerts:
    get:
      summary: List external stock alert projections
      description: Returns append-only lifecycle alert projections without internal calculation, evidence, or actor detail.
      operationId: listStockAlertsV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: STOCK_ALERT_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "occurredAt ASC, stockAlertId ASC"
      x-tombstone-policy: APPEND_ONLY_LIFECYCLE_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: skuId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [STOCK_OK, STOCK_YELLOW_ALERT, STOCK_RED_ALERT, STOCKOUT_RISK, STOCK_ZERO_OR_NOT_SELLABLE] }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Stable stock-alert snapshot page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/ops/x03b/external-stock-alert.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/inventory/allocations:
    get:
      summary: List external inventory allocation projections
      description: >-
        Returns read-only allocation state. EXTERNAL_ORDER_ITEM source_object_id is the stable
        order_item_id UUID; it must never be synthesized from order header, SKU, ordinal, hash,
        or allocation ID. This route does not reserve, confirm, release, or write ledger entries.
      operationId: listInventoryAllocationsV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: INVENTORY_ALLOCATION_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "requestedAt DESC, allocationId DESC"
      x-tombstone-policy: STATE_REVISION_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        # QĐ-6 phương án C (owner 07-09-2026): mở đúng một filter để consumer tra được phân bổ
        # của chính đơn mình. Trước đó operation khai mảng filter rỗng nên mọi query param ngoài
        # cursor/limit bị trả 422.
        - name: sourceObjectId
          in: query
          required: false
          description: >-
            Restricts the snapshot to allocations whose source_object_id equals this value. It is the
            consumer's own EXTERNAL_ORDER order_id or EXTERNAL_ORDER_ITEM order_item_id, never a
            synthesized identifier. A filtered read is still a complete snapshot of that filter, and the
            cursor is bound to it: dropping or changing the filter mid-pagination returns CURSOR_INVALID.
            A syntactically invalid or nil UUID returns VALIDATION_FAILED, never a silently unfiltered page.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stable allocation snapshot page; absent items are not deletions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/ops/x03b/external-inventory-allocation.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
    post:
      summary: Reserve finished-goods stock for an external order or order line
      description: >-
        Synchronous hold on finished-goods stock. The provider selects lots in a deterministic
        allocation order and applies the same sellability guard as the internal allocation path
        (batch release, warehouse receipt confirmation, quality hold, expiry, recall, sale lock).
        Reservation is full-fill only: a shortage reserves nothing and returns INSUFFICIENT_STOCK.
        The hold does not write a ledger entry, does not move goods, and does not confirm or release
        the allocation — those transitions belong to warehouse operations.
      operationId: reserveInventoryAllocationV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-allocation-v1
      x-permission: INVENTORY_ALLOCATION_CREATE
      x-permission-scope: SERVICE
      # ⚠ EXT-OD-04 §16.6 khóa đúng hai policy (hot + bulk) vì lúc chốt chưa có route ghi ngoài nào.
      # Route này tạm dùng bucket hot; một policy ExternalAllocationReserve riêng cần owner bổ sung
      # vào bảng đã khóa trước khi coi đây là thông số đã duyệt.
      x-rate-limit-policy: ExternalAvailabilityCheck
      x-idempotency: REQUIRED
      x-write-surface: EXTERNAL_ALLOCATION_RESERVE
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          description: >-
            Required on this write route. A network retry without it would hold stock twice for the
            same order line. A repeat call for the same source object with a new key is answered with
            reservation_status=ALREADY_RESERVED and creates nothing.
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../schemas/ops/x03b/external-allocation-reserve-request.schema.json"
      responses:
        "200":
          description: An equivalent hold already existed; nothing was created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data]
                    properties:
                      data:
                        $ref: "../../schemas/ops/x03b/external-allocation-reserve-result.schema.json"
        "201":
          description: Stock reserved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data]
                    properties:
                      data:
                        $ref: "../../schemas/ops/x03b/external-allocation-reserve-result.schema.json"
        "400":
          description: INVALID_REQUEST for a malformed body.
          x-error-code: INVALID_REQUEST
          x-http-status: 400
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/InvalidRequest" } } }
        "401":
          description: UNAUTHORIZED for missing or invalid service credentials.
          x-error-code: UNAUTHORIZED
          x-http-status: 401
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/Unauthorized" } } }
        "403":
          description: FORBIDDEN when the principal lacks INVENTORY_ALLOCATION_CREATE or the allocation audience.
          x-error-code: FORBIDDEN
          x-http-status: 403
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/Forbidden" } } }
        "404":
          description: NOT_FOUND for an unknown SKU or an unknown, inactive, or inaccessible warehouse.
          x-error-code: NOT_FOUND
          x-http-status: 404
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/NotFound" } } }
        "409":
          description: >-
            INSUFFICIENT_STOCK when no combination of allocatable lots can fill the exact quantity,
            or ALLOCATION_CONFLICT when the same source object already holds a different scope or
            quantity. Neither reserves anything.
          x-error-code: INSUFFICIENT_STOCK
          x-http-status: 409
          x-retryable: false
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/InsufficientStock"
                  - $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/AllocationConflict"
        "422":
          description: VALIDATION_FAILED for a missing idempotency key, malformed quantity, or non-conforming UOM code.
          x-error-code: VALIDATION_FAILED
          x-http-status: 422
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/ValidationFailed" } } }
        "429":
          description: RATE_LIMITED.
          x-error-code: RATE_LIMITED
          x-http-status: 429
          x-retryable: true
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/RateLimited" } } }
        "500":
          description: INTERNAL_ERROR.
          x-error-code: INTERNAL_ERROR
          x-http-status: 500
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/InternalError" } } }
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque server-issued cursor bound to operation, filters, scope, principal, snapshot, and high-watermark. Omit on first page.
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    CursorInvalid:
      description: CURSOR_INVALID for malformed, tampered, or wrong-scope cursor.
      x-error-code: CURSOR_INVALID
      x-http-status: 400
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/CursorInvalid" } } }
    Unauthorized:
      description: Safe authentication failure.
      x-error-code: UNAUTHORIZED
      x-http-status: 401
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/Unauthorized" } } }
    Forbidden:
      description: Required operation permission or SERVICE scope is missing.
      x-error-code: FORBIDDEN
      x-http-status: 403
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/Forbidden" } } }
    NotFound:
      description: Filtered resource scope is not found or inaccessible.
      x-error-code: NOT_FOUND
      x-http-status: 404
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/NotFound" } } }
    RequestTimeout:
      description: Request timed out before a safe snapshot page was returned.
      x-error-code: REQUEST_TIMEOUT
      x-http-status: 408
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/RequestTimeout" } } }
    ChangeFeedGap:
      description: CHANGE_FEED_GAP; discard the partial page and start fail-closed full reconciliation.
      x-error-code: CHANGE_FEED_GAP
      x-http-status: 409
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/ChangeFeedGap" } } }
    CursorExpired:
      description: CURSOR_EXPIRED after the absolute 30-minute TTL; restart full reconciliation.
      x-error-code: CURSOR_EXPIRED
      x-http-status: 410
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/CursorExpired" } } }
    UnprocessableEntity:
      description: Query validation or guard failure.
      x-error-code: VALIDATION_FAILED
      x-http-status: 422
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/ValidationFailed" } } }
    TooManyRequests:
      description: RATE_LIMITED; caller must honor Retry-After and the 30-second total retry budget.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After: { required: true, schema: { type: integer, minimum: 1 } }
        X-RateLimit-Limit: { required: true, schema: { type: integer, const: 2 } }
        X-RateLimit-Remaining: { required: true, schema: { type: integer, minimum: 0 } }
        X-RateLimit-Reset: { required: true, schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/RateLimited" } } }
    InternalServerError:
      description: Safe internal error without stack trace or partition key.
      x-error-code: INTERNAL_ERROR
      x-http-status: 500
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/InternalError" } } }
    BadGateway:
