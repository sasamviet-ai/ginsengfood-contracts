openapi: 3.1.0
info:
  title: Ops Core Inventory API
  version: 1.0.0
  description: >-
    Protected external inventory facades. Every read operation is read-only, uses a dedicated
    response whitelist, and must not mutate inventory truth. Collection reads use opaque,
    scope-bound full-snapshot cursors; delta feeds are not published in v1. The only write
    surface is the pair of hold commands on /v1/inventory/allocations: reserve
    (reserveInventoryAllocationV1) and consumer self-release (releaseInventoryAllocationV1).
    Both are deliberate, owner-approved exceptions to the read/check-only default; neither moves
    goods or writes a ledger entry. Confirming, issuing and warehouse release stay with warehouse
    operations.
servers:
  - url: https://api.example.local
    description: Placeholder only.
x-owner-decision-ref: OWNER-DIRECTIVE-2026-09-03-EXT-OD-01-07
x-audience-catalog:
  ginsengfood-ops-core-external-bulk-read-v1:
    auth_class: SERVICE_BEARER
    token_use: service
    permission_scope: SERVICE
  ginsengfood-ops-core-external-allocation-v1:
    auth_class: SERVICE_BEARER
    token_use: service
    permission_scope: SERVICE
x-rate-limit-policies:
  ExternalWarehouseRead:
    sustained_rps_per_principal: 5
    burst_per_principal: 10
    fleet_rps: 25
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    server_timeout_seconds: 10
    queue_limit: 0
    partition_claims: [token_use, sub]
    required_token_use: service
    principal_sub_format: uuid
    limiter_authority: DISTRIBUTED_INGRESS_TOKEN_BUCKET
    in_process_limiter: DEFENSE_IN_DEPTH_ONLY
    pre_auth_partition: TRUSTED_PROXY_VERIFIED_IP_ONLY
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
    exhausted_or_unavailable_behavior: FAIL_CLOSED_NO_CACHED_PASS
  ExternalBulkRead:
    sustained_rps_per_principal: 2
    burst_per_principal: 4
    fleet_rps: 10
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    server_timeout_seconds: 10
    queue_limit: 0
    partition_claims: [token_use, sub]
    required_token_use: service
    principal_sub_format: uuid
    limiter_authority: DISTRIBUTED_INGRESS_TOKEN_BUCKET
    in_process_limiter: DEFENSE_IN_DEPTH_ONLY
    pre_auth_partition: TRUSTED_PROXY_VERIFIED_IP_ONLY
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
    exhausted_or_unavailable_behavior: FAIL_CLOSED_NO_CACHED_PASS
  # Owner decision C25 (2026-09-08). Its own bucket, shared only by the two allocation write operations, so a burst of
  # availability checks or snapshot reads cannot starve the commands that prevent overselling. The partition key is
  # policy name + principal, not the route: reserve and release draw from the same bucket.
  ExternalAllocationWrite:
    sustained_rps_per_principal: 5
    burst_per_principal: 10
    fleet_rps: 25
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    queue_limit: 0
    partition_claims: [token_use, sub]
    required_token_use: service
    principal_sub_format: uuid
    limiter_authority: DISTRIBUTED_INGRESS_TOKEN_BUCKET
    in_process_limiter: DEFENSE_IN_DEPTH_ONLY
    pre_auth_partition: TRUSTED_PROXY_VERIFIED_IP_ONLY
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
    exhausted_or_unavailable_behavior: FAIL_CLOSED_NO_CACHED_PASS
x-retry-policies:
  ExternalBulkReadRetry:
    max_retries: 2
    total_budget_seconds: 30
    retryable_statuses: [408, 429, 502, 503, 504]
    non_retryable_statuses: [400, 401, 403, 404, 409, 410, 422, 500]
    honor_retry_after: true
    backoff: FULL_JITTER_BASE_500MS_CAP_5S
  # Write commands (reserve, release). The retry IS a replay: the same X-Idempotency-Key with the same body. The provider
  # answers a replay of a finished call with the original result (reserve: 200 ALREADY_RESERVED, release: the original 200)
  # and a replay of a call that is still running with 429 + Retry-After: 1, so replaying is always valid. The one exception to
  # "original result" is a reserve replay whose hold has meanwhile expired or been released: it is 409 ALLOCATION_CONFLICT (see
  # the 409 of reserve; a new key only if the order is still live), not replayed again automatically. Replay after a lost
  # response, a timeout, 502/503/504, or a 429 (bucket empty, same key still running, temporary contention), honoring
  # Retry-After. Never send a new key for the same intent: a new key for the same source can hold stock twice (reserve) or
  # release twice. max_retries is the recommended ceiling for automatic replays, not a cap the provider enforces (it counts
  # none), but each replay draws a token from the ExternalAllocationWrite bucket. A 409 or 422 is not replayed automatically;
  # a reserve quota refusal (HOLD_LIMIT_REACHED, HOLD_SHARE_LIMIT_REACHED) may be sent again with the same key once the
  # principal has released holds or holds have expired. When the budget runs out the outcome is UNKNOWN, neither held nor
  # refused: keep the same key and body and reconcile with GET /v1/inventory/allocations?sourceObjectId=.
  ExternalIdempotentReplay:
    max_retries: 5
    provider_enforces_cap: false
    replay: SAME_IDEMPOTENCY_KEY_AND_PAYLOAD_ONLY
    retryable_statuses: [408, 429, 502, 503, 504]
    non_retryable_statuses: [400, 401, 403, 404, 409, 422, 500]
    honor_retry_after: true
    backoff: GROWING_PAUSE_WITH_JITTER
    after_budget: OUTCOME_UNKNOWN_KEEP_SAME_KEY_AND_BODY
x-pagination-policies:
  ExternalSnapshotCursorV1:
    mode: OPAQUE_SCOPE_BOUND_SNAPSHOT_CURSOR
    cursor_version: 1
    cursor_ttl_seconds: 1800
    cursor_ttl_mode: ABSOLUTE_NON_SLIDING
    integrity_protected: true
    default_limit: 50
    max_limit: 100
    page_max_items: 100
    page_item_count_semantics: EXACT_CURRENT_PAGE_DATA_LENGTH
    item_count_semantics: EXACT_FULL_SNAPSHOT_TOTAL
    delivered_item_count_semantics: CUMULATIVE_THROUGH_CURRENT_PAGE
    complete_requires: DELIVERED_COUNT_EQUALS_ITEM_COUNT_AND_NEXT_CURSOR_NULL
    manifest_version: 1
    manifest_algorithm: SHA-256
    manifest_canonicalization: JCS_RFC8785
    manifest_document_fields: [manifest_version, resource, snapshot_id, as_of, high_watermark, item_count, items]
    manifest_items_semantics: COMPLETE_STABLE_SORTED_SNAPSHOT
    verify_manifest_before_absence_reconcile: true
    delta_supported: false
    delta_replay_retention_seconds: 604800
    delta_poll_seconds: 30
    delta_poll_jitter_percent: 20
    future_tombstone_retention_seconds: 7776000
    snapshot_refresh_seconds: 300
    full_reconciliation_seconds: 21600
    full_reconciliation_triggers: [STARTUP, RESUME, CHANGE_FEED_GAP, CURSOR_EXPIRED]
    gap_reconcile_start_within_seconds: 60
    cursor_bindings: [operation, resource, filters, sort, scope, principal, snapshot, high_watermark]
    gap_recovery: FAIL_CLOSED_FULL_RECONCILE
    expired_cursor_recovery: FULL_RECONCILE_NO_TIMESTAMP_OR_LOCAL_CHECKPOINT
    absence_reconcile_requires: FULL_SNAPSHOT_COMPLETE_VERIFIED_MANIFEST_COUNT_HASH
paths:
  /v1/inventory/stock-balances:
    get:
      summary: List external stock balance projections
      description: Returns a derived, read-only stock snapshot. This snapshot is not final sell authority and cannot be used to mutate the ledger.
      operationId: listStockBalancesV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: INVENTORY_BALANCE_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalWarehouseRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "stockBalanceId ASC"
      x-tombstone-policy: SNAPSHOT_ONLY_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: skuId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: materialId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: itemType
          in: query
          required: false
          schema: { type: string, enum: [MATERIAL, PACKAGING, FINISHED_GOOD] }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Stable stock-balance snapshot page; empty snapshots return data=[] with complete=true.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/ops/x03b/external-stock-balance.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/inventory/ledger:
    get:
      summary: List external inventory ledger entries
      description: Returns append-only ledger projections. The route has no mutation, delete, or tombstone behavior.
      operationId: listInventoryLedgerV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: INVENTORY_LEDGER_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "occurredAt ASC, ledgerEntryId ASC"
      x-tombstone-policy: APPEND_ONLY_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Stable append-only ledger snapshot page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/ops/x03b/external-inventory-ledger-entry.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/inventory/stock-alerts:
    get:
      summary: List external stock alert projections
      description: Returns append-only lifecycle alert projections without internal calculation, evidence, or actor detail.
      operationId: listStockAlertsV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: STOCK_ALERT_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "occurredAt ASC, stockAlertId ASC"
      x-tombstone-policy: APPEND_ONLY_LIFECYCLE_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: skuId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [STOCK_OK, STOCK_YELLOW_ALERT, STOCK_RED_ALERT, STOCKOUT_RISK, STOCK_ZERO_OR_NOT_SELLABLE] }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Stable stock-alert snapshot page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/ops/x03b/external-stock-alert.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/inventory/allocations:
    get:
      summary: List external inventory allocation projections
      description: >-
        Returns read-only allocation state. EXTERNAL_ORDER_ITEM source_object_id is the stable
        order_item_id UUID; it must never be synthesized from order header, SKU, ordinal, hash,
        or allocation ID. This route does not reserve, confirm, release, or write ledger entries.
        status is one of RESERVED, CONFIRMED, ISSUED, RELEASED (enums/ops/inventory-allocation-status.yaml,
        state-machines/ops/allocation-state.md); a consumer must tolerate a value it does not know.
        Expiry, warehouse release and consumer self-release all read RELEASED.
        The snapshot lists only allocations created by the calling service principal: holds, CONFIRMED
        or ISSUED rows of another principal for the same source are not visible. allocated_quantity is
        written without trailing zeros here ("5", "0.5"), while reserve and release lines always carry
        three decimals ("5.000"); compare quantities as decimals, never as strings.
      operationId: listInventoryAllocationsV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-bulk-read-v1
      x-permission: INVENTORY_ALLOCATION_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalWarehouseRead
      x-retry-policy: ExternalBulkReadRetry
      x-pagination-policy: ExternalSnapshotCursorV1
      x-delta-supported: false
      x-stable-sort: "requestedAt DESC, allocationId DESC"
      x-tombstone-policy: STATE_REVISION_NO_TOMBSTONE
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        # QĐ-6 phương án C (owner 07-09-2026): mở đúng một filter để consumer tra được phân bổ
        # của chính đơn mình. Trước đó operation khai mảng filter rỗng nên mọi query param ngoài
        # cursor/limit bị trả 422.
        - name: sourceObjectId
          in: query
          required: false
          description: >-
            Restricts the snapshot to allocations whose source_object_id equals this value. It is the
            consumer's own EXTERNAL_ORDER order_id or EXTERNAL_ORDER_ITEM order_item_id, never a
            synthesized identifier. A filtered read is still a complete snapshot of that filter, and the
            cursor is bound to it: dropping or changing the filter mid-pagination returns CURSOR_INVALID.
            A syntactically invalid or nil UUID returns VALIDATION_FAILED, never a silently unfiltered page.
            Consumers must always send it: only allocations created by the calling principal are ever
            returned, so an unfiltered read has no consumer use case, and a later contract revision makes the
            parameter required (a request without it then answers 422 VALIDATION_FAILED with
            details[0] = { field: "sourceObjectId", reason: "SOURCE_OBJECT_ID_REQUIRED" }).
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Stable allocation snapshot page; absent items are not deletions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data, meta]
                    properties:
                      data:
                        type: array
                        maxItems: 100
                        items:
                          $ref: "../../schemas/ops/x03b/external-inventory-allocation.schema.json"
                      meta:
                        $ref: "../../schemas/ops/x03b/external-snapshot-meta.schema.json"
        "400": { $ref: "#/components/responses/CursorInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/ChangeFeedGap" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
    post:
      summary: Reserve finished-goods stock for an external order or order line
      description: >-
        Synchronous hold on finished-goods stock. The provider selects lots in a deterministic
        allocation order and applies the same sellability guard as the internal allocation path
        (batch release, warehouse receipt confirmation, quality hold, expiry, recall, sale lock).
        Reservation is full-fill only: a shortage reserves nothing and returns INSUFFICIENT_STOCK.
        The hold does not write a ledger entry, does not move goods, and does not confirm or release
        the allocation. Confirming and issuing belong to warehouse operations; the consumer can end its
        own RESERVED hold only through releaseInventoryAllocationV1, and a hold it does not release
        expires on its own (default 30 minutes, at most 24 hours; expires_at is a request field).
        X-Idempotency-Key is required: a network retry without it would hold stock twice for the same
        order line, so after a lost response repeat the call with the same key and the same body. The
        idempotency scope of this operation is the source: a key sent for a different source is a new
        command, and a key already used for the same source with a different body (the fingerprint
        includes expires_at, so a retry must resend the original expires_at unchanged) is 422
        VALIDATION_FAILED naming the header. A key belongs to the service principal that first used it
        (another principal gets 403). A call whose first attempt with the same key is still running is
        429 with Retry-After: 1. A 429 is also the answer when the provider's own database transaction
        kept being rejected because of concurrent activity on the same source or stock and its internal
        retries ran out (temporary contention): that is neither out of stock nor a change of state, the key
        stays reusable, so wait Retry-After and repeat with the same key and the same body. A repeat call for the same source object with a new key and the same
        scope and quantity is answered with reservation_status=ALREADY_RESERVED when the existing hold is
        this principal's own: it creates nothing and never extends the hold (the lines keep their
        original expires_at). A source held by another principal is 409 INSUFFICIENT_STOCK and the holder
        is never disclosed, whatever the state of that hold, ISSUED included. A source whose allocation
        of this same principal the warehouse already issued is answered 409 ALLOCATION_CONFLICT whatever
        the key. Retries and rate limits are described by the x-retry-policy and x-rate-limit-policy
        entries. The closed table of details[].reason is in docs/m3-allocation-integration-notes.md and in
        x-detail-reasons of the reserve error schema.
      operationId: reserveInventoryAllocationV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-allocation-v1
      x-permission: INVENTORY_ALLOCATION_CREATE
      x-permission-scope: SERVICE
      # Owner decision C25 (2026-09-08): own token bucket, defined in x-rate-limit-policies above
      # (5 rps / burst 10 / fleet 25) and shared with releaseInventoryAllocationV1. It no longer
      # shares the availability-check bucket.
      x-rate-limit-policy: ExternalAllocationWrite
      x-retry-policy: ExternalIdempotentReplay
      x-idempotency: REQUIRED
      x-idempotency-disposition: IDEMPOTENCY_KEY_REQUIRED
      x-write-surface: EXTERNAL_ALLOCATION_RESERVE
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: OWNER-DIRECTIVE-2026-09-05-EXT-ALLOC-RESERVE
      # Provider configuration, not wire. The values directly under x-provider-limits are the ones the provider uses today
      # when nothing overrides them. guaranteed_minimums are the numbers a consumer may rely on, fixed on 2026-11-14 through
      # SEC-15 / M3-158: every deployment a consumer is connected to is configured at or above each of them, a value above
      # its minimum may change without a contract change, and going below a minimum is a contract change announced to the
      # consumer before it is deployed. docs/m3-allocation-integration-notes.md section 7 has the meaning and the consumer
      # rule, and the table of which statuses (RESERVED, CONFIRMED, RELEASED, ISSUED, expired RESERVED) count against the
      # hold-number cap and the on-hand share cap, and when they stop counting.
      x-provider-limits:
        config_section: ExternalApi:AllocationHoldLimits
        status: CURRENT_DEFAULTS
        max_active_holds_per_principal: 200
        max_hold_window_minutes: 60
        default_hold_window_minutes: 30
        max_share_of_on_hand_percent: 80
        share_floor_quantity: 50
        max_requested_quantity_per_line: 1000
        guaranteed_minimums:
          max_active_holds_per_principal: 200
          max_hold_window_minutes: 60
          max_share_of_on_hand_percent: 80
          share_floor_quantity: 50
          max_requested_quantity_per_line: 1000
        guaranteed_minimums_decision: SEC-15 / M3-158, fixed 2026-11-14
        guaranteed_minimums_change_rule: LOWERING_IS_A_CONTRACT_CHANGE_ANNOUNCED_BEFORE_DEPLOY
        consumer_rule: FAIL_CLOSED_ON_EVERY_LIMIT_REFUSAL
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../schemas/ops/x03b/external-allocation-reserve-request.schema.json"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: An equivalent hold of this service principal already existed; nothing was created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data]
                    properties:
                      data:
                        $ref: "../../schemas/ops/x03b/external-allocation-reserve-result.schema.json"
        "201":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Stock reserved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data]
                    properties:
                      data:
                        $ref: "../../schemas/ops/x03b/external-allocation-reserve-result.schema.json"
        "400":
          description: INVALID_REQUEST for a malformed body.
          x-error-code: INVALID_REQUEST
          x-http-status: 400
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/InvalidRequest" } } }
        "401":
          description: UNAUTHORIZED for missing or invalid service credentials.
          x-error-code: UNAUTHORIZED
          x-http-status: 401
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/Unauthorized" } } }
        "403":
          description: >-
            FORBIDDEN when the principal lacks INVENTORY_ALLOCATION_CREATE or the allocation audience, when the
            token carries no subject, or when the X-Idempotency-Key was first used by another service principal.
          x-error-code: FORBIDDEN
          x-http-status: 403
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/Forbidden" } } }
        "404":
          description: NOT_FOUND for an unknown SKU or an unknown, inactive, or inaccessible warehouse.
          x-error-code: NOT_FOUND
          x-http-status: 404
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/NotFound" } } }
        "409":
          description: >-
            INSUFFICIENT_STOCK is one code for five causes the provider does not disclose: no combination
            of allocatable lots fills the exact quantity; lots hold stock but are blocked (sale lock,
            recall, quality hold, batch not released); the same source object already holds a different
            warehouse, unit or quantity; the source is held by another service principal (in any state,
            including ISSUED; the holder is not disclosed); or more than 20 lots would be needed. It does not mean out of stock - call POST /v1/availability/check
            for the reason. ALLOCATION_CONFLICT means the hold recorded for this idempotency key is no
            longer held (it expired, or the warehouse or the consumer's own releaseInventoryAllocationV1
            released it: send a new key if the order is still live), or the source was already ISSUED by
            the warehouse for an allocation of this same principal (do not reserve it again, whatever the
            key). An ISSUED allocation created by another principal is not visible to the caller and is
            answered INSUFFICIENT_STOCK, never ALLOCATION_CONFLICT. Neither reserves anything. To tell the
            ALLOCATION_CONFLICT causes apart, read GET /v1/inventory/allocations?sourceObjectId= once: an
            ISSUED row of your own means stop. Temporary contention is never reported as INSUFFICIENT_STOCK or
            ALLOCATION_CONFLICT; it is 429 RATE_LIMITED.
            ALLOCATION_CONFLICT is also returned when the service principal has reached one of its
            configured reservation limits; error.details[0].reason is then HOLD_LIMIT_REACHED (number of
            active holds; one hold = one source_object_id) or HOLD_SHARE_LIMIT_REACHED (share of the SKU's
            physical on-hand stock the principal may hold at once). These are quota refusals, not shortages:
            stock may be intact. Nothing is reserved and the X-Idempotency-Key is not consumed, so the same
            request may be sent again with the same key after the principal has released holds or holds have
            expired. The limits themselves are provider configuration and are never echoed; their current defaults
            are in x-provider-limits and docs/m3-allocation-integration-notes.md section 7, which also gives the
            minimum numbers a consumer may rely on (guaranteed_minimums, fixed 2026-11-14). Fail closed on every limit refusal.
          x-error-code: INSUFFICIENT_STOCK
          x-http-status: 409
          x-retryable: false
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/InsufficientStock"
                  - $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/AllocationConflict"
        "422":
          description: >-
            VALIDATION_FAILED for a missing, malformed or over-long X-Idempotency-Key, or one already used for
            the same source with a different request body (details[].field is the header name), a malformed
            quantity, a non-conforming UOM code, requested_quantity above the per-request limit
            (details[].reason REQUESTED_QUANTITY_LIMIT_EXCEEDED), or expires_at later than the maximum hold
            window (details[].reason EXPIRES_AT_LIMIT_EXCEEDED). Those two reasons and IDEMPOTENCY_KEY_REUSED
            are the stable tokens; any other details[].reason is free text and not contractual, handle it by
            details[].field and do not retry the request unchanged.
          x-error-code: VALIDATION_FAILED
          x-http-status: 422
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/ValidationFailed" } } }
        "429": { $ref: "#/components/responses/AllocationReserveRateLimited" }
        "500":
          description: INTERNAL_ERROR.
          x-error-code: INTERNAL_ERROR
          x-http-status: 500
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/InternalError" } } }
  /v1/inventory/allocations/release:
    post:
      summary: Release the finished-goods hold of an external order or order line
      description: >-
        Narrow self-release for the consumer, for example when an order is cancelled before the
        warehouse confirms it. It releases every RESERVED line that this same service principal
        created for the source (source_object_type, source_object_id) and that has not expired, or
        releases nothing: the body carries no quantity and no lot. The effect is that of a warehouse
        release or a hold expiry - the quantity returns to the lot's available quantity, no ledger
        entry is written, no goods move - and the allocation reads RELEASED.
        Verdict order, looking only at lines of the calling principal: a CONFIRMED or ISSUED line means
        409 ALLOCATION_CONFLICT and nothing at all is released (the warehouse committed part of the
        order; contact the warehouse); otherwise every RESERVED line still inside its expiry is
        released (200); otherwise, if the principal has lines but none can be released (already
        RELEASED, or RESERVED past expires_at and waiting for the expiry worker) it is
        409 ALLOCATION_NOT_HELD, which a cancelling consumer treats as success; otherwise 404. A source
        held only by another principal is a 404 with the same message as an unknown source.
        Expiry stays with the provider worker: this route never releases a line that is past its expiry.
        X-Idempotency-Key is required. A replay with the same key returns the original 200 body
        unchanged (same lines, same released_at) and does not release anything again. The idempotency
        scope of this operation is the key alone, not the source: a key reused for a different source is
        422 VALIDATION_FAILED naming the header. A key belongs to the service principal that first used it
        (another principal gets 403). A call whose first attempt with the same key is still running is
        429 with Retry-After: 1. A 429 is also the answer when the provider's own database transaction kept
        being rejected because of concurrent activity and its internal retries ran out (temporary
        contention): nothing was released, the key stays reusable, so wait Retry-After and repeat with the
        same key and the same body. The route uses the same permission
        (INVENTORY_ALLOCATION_CREATE) and audience as reserveInventoryAllocationV1; the warehouse
        permission INVENTORY_ALLOCATION_RELEASE is never granted to a service principal.
        Retries and rate limits are described by the x-retry-policy and x-rate-limit-policy entries. The
        closed table of details[].reason is in docs/m3-allocation-integration-notes.md and in x-detail-reasons of
        the release error schema; details exist on 422 only on this route.
      operationId: releaseInventoryAllocationV1
      tags: [inventory]
      security:
        - ServiceBearer: []
      x-auth-class: SERVICE_BEARER
      x-token-use: service
      x-audience: ginsengfood-ops-core-external-allocation-v1
      x-permission: INVENTORY_ALLOCATION_CREATE
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalAllocationWrite
      x-retry-policy: ExternalIdempotentReplay
      x-idempotency: REQUIRED
      x-idempotency-disposition: IDEMPOTENCY_KEY_REQUIRED
      x-write-surface: EXTERNAL_ALLOCATION_RELEASE
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: OD-M3-REPLY-01
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../../schemas/ops/x03b/external-allocation-release-request.schema.json"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: >-
            The lines in data.allocations were RESERVED by the calling principal and are now RELEASED.
            Replaying the call with the same X-Idempotency-Key returns this body again.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    required: [schemaVersion, correlation, data]
                    properties:
                      data:
                        $ref: "../../schemas/ops/x03b/external-allocation-release-result.schema.json"
        "400":
          description: INVALID_REQUEST for an empty or malformed body.
          x-error-code: INVALID_REQUEST
          x-http-status: 400
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/InvalidRequest" } } }
        "401":
          description: UNAUTHORIZED for missing or invalid service credentials.
          x-error-code: UNAUTHORIZED
          x-http-status: 401
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/Unauthorized" } } }
        "403":
          description: >-
            FORBIDDEN when the principal lacks INVENTORY_ALLOCATION_CREATE or the allocation audience, when the
            token carries no subject, or when the X-Idempotency-Key was first used by another service principal.
          x-error-code: FORBIDDEN
          x-http-status: 403
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/Forbidden" } } }
        "404":
          description: >-
            NOT_FOUND when this service principal holds no allocation for the source. An unknown source and
            a source held only by another principal are indistinguishable.
          x-error-code: NOT_FOUND
          x-http-status: 404
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/NotFound" } } }
        "409":
          description: >-
            ALLOCATION_CONFLICT when the warehouse already CONFIRMED or ISSUED stock of the source (nothing
            was released; contact the warehouse), or when the allocation changed while the release was being
            processed; the code is the same for both and only the message differs, so read
            GET /v1/inventory/allocations?sourceObjectId= once instead of looping. Temporary contention that
            outlasts the provider's own retries is 429 RATE_LIMITED, not this 409. ALLOCATION_NOT_HELD when nothing of this principal is held for the source
            any more: it was already released, or its hold expired and the expiry worker has not swept it yet.
            Nothing is changed, and a new key gives the same answer.
          x-error-code: ALLOCATION_CONFLICT
          x-http-status: 409
          x-retryable: false
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/AllocationConflict"
                  - $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/AllocationNotHeld"
        "422":
          description: >-
            VALIDATION_FAILED for a missing, malformed or over-long X-Idempotency-Key, or one reused for a
            different source (details[].field is the header name, details[].reason IDEMPOTENCY_KEY_REUSED), or
            for an unsupported source_object_type or source_object_id. Any other details[].reason is free text and
            not contractual: handle it by details[].field. This is the only release answer that carries details.
          x-error-code: VALIDATION_FAILED
          x-http-status: 422
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/ValidationFailed" } } }
        "429": { $ref: "#/components/responses/AllocationReleaseRateLimited" }
        "500":
          description: INTERNAL_ERROR.
          x-error-code: INTERNAL_ERROR
          x-http-status: 500
          x-retryable: false
          content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/InternalError" } } }
components:
  headers:
    CorrelationId:
      description: >-
        The correlation id in effect for this request: the X-Correlation-Id of the request when it was valid, otherwise a UUID
        generated by the provider. Compare it with the one you sent before assuming it is yours.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9:_.-]{1,128}$" }
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Optional trace id: 1 to 128 characters of A-Z, a-z, 0-9, colon, underscore, dot and hyphen, counted after leading and
        trailing white space is trimmed. Absent, empty or malformed is not an error: the provider ignores the value, generates
        a UUID and uses that one, and the request is processed normally. The id in effect always comes back, in the
        X-Correlation-Id response header and in correlation.correlationId of the response body (error.correlationId of an
        error body); a consumer that sent a valid id gets the same id back, so compare it before assuming it is yours. Put
        nothing secret or personal in it. The same rule is in docs/correlation-audit-standard.md.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9:_.-]{1,128}$" }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque server-issued cursor bound to operation, filters, scope, principal, snapshot, and high-watermark. Omit on first page.
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: >-
        Required on both allocation write operations (1-200 characters, letters, digits and : - _ . only; leading and
        trailing whitespace is trimmed). A missing, over-long or malformed key is 422 VALIDATION_FAILED with
        details[].field set to X-Idempotency-Key. Repeating a call with the same key and the same body returns the
        original answer. What counts as the same command differs: for reserve the scope is the source (the same
        key with another source is a new command; the same key and source with a different body, expires_at
        included, is 422); for release the scope is the key alone (the same key with another source is 422). A key
        belongs to the service principal that first used it; another principal gets 403. A call whose first
        attempt is still running is 429 with Retry-After: 1. Generate one key per intent and keep it across
        retries of that intent.
      schema: { type: string, minLength: 1, maxLength: 200, pattern: "^[A-Za-z0-9:_.-]+$" }
  responses:
    AllocationReserveRateLimited:
      description: >-
        RATE_LIMITED with three causes that share one code, one status and one way to handle them. The
        ExternalAllocationWrite bucket is empty (X-RateLimit-* headers present). A call with the same
        X-Idempotency-Key is still running (Retry-After: 1). Or temporary contention: the provider's database
        transaction was rejected because of concurrent activity on the same source or stock and its internal
        retries (6 attempts, a few hundred milliseconds in total) ran out, Retry-After: 1, message "The request could not be completed because of concurrent activity. Retry later with the same X-Idempotency-Key.",
        no details. Contention is not out of stock and changes no state, so the key stays reusable. In every case
        honor Retry-After, then repeat the call with the same key and the same body; never send a new key for the
        same intent. Only the message text tells the causes apart, and it is not contractual.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After: { required: true, schema: { type: integer, minimum: 1 } }
        X-RateLimit-Limit: { required: false, schema: { type: integer, const: 5 } }
        X-RateLimit-Remaining: { required: false, schema: { type: integer, minimum: 0 } }
        X-RateLimit-Reset: { required: false, schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-reserve-error.schema.json#/$defs/RateLimited" } } }
    AllocationReleaseRateLimited:
      description: >-
        RATE_LIMITED with three causes that share one code, one status and one way to handle them. The
        ExternalAllocationWrite bucket (shared with reserve) is empty (X-RateLimit-* headers present). A call
        with the same X-Idempotency-Key is still running (Retry-After: 1). Or temporary contention: the
        provider's database transaction was rejected because of concurrent activity and its internal retries
        (6 attempts, a few hundred milliseconds in total) ran out, Retry-After: 1, message "The request could not be completed because of concurrent activity. Retry later with the same X-Idempotency-Key.",
        no details. Contention releases nothing and changes no state, so the key stays reusable. In every case
        honor Retry-After, then repeat the call with the same key and the same body; never send a new key for the
        same intent. Only the message text tells the causes apart, and it is not contractual.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After: { required: true, schema: { type: integer, minimum: 1 } }
        X-RateLimit-Limit: { required: false, schema: { type: integer, const: 5 } }
        X-RateLimit-Remaining: { required: false, schema: { type: integer, minimum: 0 } }
        X-RateLimit-Reset: { required: false, schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-allocation-release-error.schema.json#/$defs/RateLimited" } } }
    CursorInvalid:
      description: CURSOR_INVALID for malformed, tampered, or wrong-scope cursor.
      x-error-code: CURSOR_INVALID
      x-http-status: 400
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/CursorInvalid" } } }
    Unauthorized:
      description: Safe authentication failure.
      x-error-code: UNAUTHORIZED
      x-http-status: 401
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/Unauthorized" } } }
    Forbidden:
      description: Required operation permission or SERVICE scope is missing.
      x-error-code: FORBIDDEN
      x-http-status: 403
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/Forbidden" } } }
    NotFound:
      description: Filtered resource scope is not found or inaccessible.
      x-error-code: NOT_FOUND
      x-http-status: 404
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/NotFound" } } }
    RequestTimeout:
      description: Request timed out before a safe snapshot page was returned.
      x-error-code: REQUEST_TIMEOUT
      x-http-status: 408
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/RequestTimeout" } } }
    ChangeFeedGap:
      description: CHANGE_FEED_GAP; discard the partial page and start fail-closed full reconciliation.
      x-error-code: CHANGE_FEED_GAP
      x-http-status: 409
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/ChangeFeedGap" } } }
    CursorExpired:
      description: CURSOR_EXPIRED after the absolute 30-minute TTL; restart full reconciliation.
      x-error-code: CURSOR_EXPIRED
      x-http-status: 410
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/CursorExpired" } } }
    UnprocessableEntity:
      description: Query validation or guard failure.
      x-error-code: VALIDATION_FAILED
      x-http-status: 422
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/ValidationFailed" } } }
    TooManyRequests:
      description: RATE_LIMITED; caller must honor Retry-After and the 30-second total retry budget.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After: { required: true, schema: { type: integer, minimum: 1 } }
        X-RateLimit-Limit: { required: true, description: "sustained_rps_per_principal of the x-rate-limit-policy of the operation: 5 for ExternalWarehouseRead (listStockBalancesV1, listInventoryAllocationsV1), 2 for ExternalBulkRead (listInventoryLedgerV1, listStockAlertsV1)", schema: { type: integer, enum: [2, 5] } }
        X-RateLimit-Remaining: { required: true, schema: { type: integer, minimum: 0 } }
        X-RateLimit-Reset: { required: true, schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/RateLimited" } } }
    InternalServerError:
      description: Safe internal error without stack trace or partition key.
      x-error-code: INTERNAL_ERROR
      x-http-status: 500
      x-retryable: false
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/InternalError" } } }
    BadGateway:
      description: Upstream bad gateway; retry only within ExternalBulkReadRetry.
      x-error-code: BAD_GATEWAY
      x-http-status: 502
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/BadGateway" } } }
    ServiceUnavailable:
      description: Service unavailable; retry only within ExternalBulkReadRetry.
      x-error-code: SERVICE_UNAVAILABLE
      x-http-status: 503
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/ServiceUnavailable" } } }
    GatewayTimeout:
      description: Gateway timeout; retry only within ExternalBulkReadRetry.
      x-error-code: GATEWAY_TIMEOUT
      x-http-status: 504
      x-retryable: true
      content: { application/json: { schema: { $ref: "../../schemas/ops/x03b/external-bulk-read-error-envelopes.schema.json#/$defs/GatewayTimeout" } } }
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
