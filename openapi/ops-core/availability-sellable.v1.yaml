openapi: 3.1.0
info:
  title: Ops Core Availability Sellable API
  version: 1.0.0
  description: Availability and sellable v1 API contract. Business-platform may check sellable status but must not mutate ops-core truth.
servers:
  - url: https://api.example.local
    description: Placeholder only.
paths:
  /v1/availability/check:
    post:
      summary: Check availability and sellable status
      description: "Checks ops-core sellable/availability state for a SKU or batch. This endpoint is a read/guard check for business-platform and does not mutate inventory, recall, sale lock, trace, batch, warehouse, or sellable-status truth. channel_context is consumer context only and is not an authorization or sellable-decision input.\n\nThe `sellable_status_id` in this response is EPHEMERAL and is a correlation token, not a lookup key. This path evaluates without persisting, so the identifier is newly generated on every call and no matching record exists: `GET /v1/sellable-statuses/{sellableStatusId}` with an identifier taken from this response always returns 404. That is deliberate - persisting one row per read on the selling hot path buys nothing, because this response already carries the whole decision (`decision`, `block_reasons[]`, and the nine boolean gates). Resolvable identifiers come only from the `ops-core.sellable.*` event stream."
      operationId: checkAvailabilityV1
      tags: [availability-sellable]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityCheckRequest"
      responses:
        "200":
          description: Sellable status wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/ops/sellable-status.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/sellable-statuses/{sellableStatusId}:
    get:
      summary: Get sellable status
      description: "Returns a previously PERSISTED sellable status record for audit/consumer traceability. Only identifiers carried by `ops-core.sellable.*` events resolve here. An identifier taken from a `POST /v1/availability/check` response is ephemeral and always returns 404 - see that operation's description."
      operationId: getSellableStatusV1
      tags: [availability-sellable]
      parameters:
        - name: sellableStatusId
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sellable status wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        $ref: "../../schemas/ops/sellable-status.schema.json"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  schemas:
    AvailabilityCheckRequest:
      type: object
      additionalProperties: false
      description: "Minimal v1 availability check request. TODO: replace with a dedicated schema if source docs later define quantity, channel, and reservation semantics."
      properties:
        sku_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
          description: Optional warehouse scope. FGSA-01 default availability scope is SKU + warehouse aggregate.
        batch_id:
          type: string
          format: uuid
        requested_quantity:
          $ref: "../../schemas/common/quantity.schema.json"
        channel_context:
          $ref: "../../schemas/common/source-ref.schema.json"
        correlation:
          $ref: "../../schemas/common/correlation.schema.json"
      required: [sku_id]
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error:
              $ref: "../../schemas/common/error.schema.json"
  responses:
    BadRequest: { description: Bad request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Permission denied., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: State conflict or idempotency conflict., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: Validation or guard failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    InternalServerError: { description: Internal server error., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
