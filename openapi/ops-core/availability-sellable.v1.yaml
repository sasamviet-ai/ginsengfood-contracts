openapi: 3.1.0
info:
  title: Ops Core Availability Sellable API
  version: 1.0.0
  description: Availability and sellable v1 API contract. Business-platform may check sellable status but must not mutate ops-core truth.
servers:
  - url: https://api.example.local
    description: Placeholder only.
x-audience-catalog:
  ginsengfood-ops-core-external-availability-v1:
    auth_class: SERVICE_BEARER
    token_use: service
    permission_scope: SERVICE
x-rate-limit-policies:
  ExternalAvailabilityCheck:
    sustained_rps_per_principal: 10
    burst_per_principal: 20
    fleet_rps: 50
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    server_timeout_seconds: 2
    queue_limit: 0
    partition_claims: [token_use, sub]
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
  ExternalBulkRead:
    sustained_rps_per_principal: 2
    burst_per_principal: 4
    fleet_rps: 10
    fleet_authority_id: OPS_CORE_EXTERNAL_FLEET_LIMITER_V1
    server_timeout_seconds: 10
    queue_limit: 0
    partition_claims: [token_use, sub]
    fleet_authority_config_key: RateLimiting__External__FleetAuthorityRef
    startup_fail_closed: true
x-retry-policies:
  ExternalAvailabilityCheckRetry:
    max_retries: 1
    total_budget_seconds: 5
    retryable_statuses: [408, 429, 502, 503, 504]
    honor_retry_after: true
    backoff: FULL_JITTER
  ExternalBulkReadRetry:
    max_retries: 2
    total_budget_seconds: 30
    retryable_statuses: [408, 429, 502, 503, 504]
    honor_retry_after: true
    backoff: FULL_JITTER_BASE_500MS_CAP_5S
paths:
  /v1/availability/check:
    post:
      summary: Check availability and sellable status
      description: "Checks ops-core sellable/availability state for a SKU or batch. This endpoint is a read/guard check for business-platform and does not mutate inventory, recall, sale lock, trace, batch, warehouse, or sellable-status truth. channel_context is consumer context only and is not an authorization or sellable-decision input.\n\nThe `sellable_status_id` in this response is EPHEMERAL and is a correlation token, not a lookup key. This path evaluates without persisting, so the identifier is newly generated on every call and no matching record exists: `GET /v1/sellable-statuses/{sellableStatusId}` with an identifier taken from this response always returns 404. That is deliberate - persisting one row per read on the selling hot path buys nothing, because this response already carries the whole decision (`decision`, `block_reasons[]`, and the nine boolean gates). Resolvable identifiers come only from the `ops-core.sellable.*` event stream.\n\n`data.decision` is `SELLABLE` or `NOT_SELLABLE` only. The cause of a refusal is in `block_reasons` and the boolean gates, not in a third decision value; the longer name list in `enums/ops/sellable-status.yaml` is reserved vocabulary that is never emitted. Sell only on exactly `SELLABLE`; any other value, including one this contract does not list, means do not sell (fail closed)."
      operationId: checkAvailabilityV1
      tags: [availability-sellable]
      security:
        - bearerAuth: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-availability-v1
      x-token-use: service
      x-permission: SELLABLE_CHECK
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalAvailabilityCheck
      x-retry-policy: ExternalAvailabilityCheckRetry
      x-idempotency-disposition: NOT_APPLICABLE_SAFE_EVALUATION
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityCheckRequest"
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Sellable status wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "../../schemas/ops/sellable-status.schema.json"
                          - type: object
                            required: [recall_case_open]
                            description: >-
                              The provider always emits recall_case_open on this read (true or false, never absent or null),
                              so a consumer may require it. The shared schema keeps it optional because the
                              ops-core.sellable.sku-became-* events do not carry it.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /v1/sellable-statuses/{sellableStatusId}:
    get:
      summary: Get sellable status
      description: "Returns a previously PERSISTED sellable status record for audit/consumer traceability. Only identifiers carried by `ops-core.sellable.*` events resolve here. An identifier taken from a `POST /v1/availability/check` response is ephemeral and always returns 404 - see that operation's description."
      operationId: getSellableStatusV1
      tags: [availability-sellable]
      parameters:
        - name: sellableStatusId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CorrelationId"
      security:
        - bearerAuth: []
      x-auth-class: SERVICE_BEARER
      x-audience: ginsengfood-ops-core-external-availability-v1
      x-token-use: service
      x-permission: SELLABLE_STATUS_VIEW
      x-permission-scope: SERVICE
      x-rate-limit-policy: ExternalBulkRead
      x-retry-policy: ExternalBulkReadRetry
      x-idempotency-disposition: NOT_APPLICABLE_READ_ONLY
      x-runtime-policy: "CURRENT_SOURCE_AUTH_AND_RATE_PARITY; FLEET_ENV_BINDING_REQUIRED"
      x-owner-decision-ref: X04D-SEC-01
      responses:
        "200":
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          description: Sellable status wrapped in the common envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "../../schemas/common/envelope.schema.json"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "../../schemas/ops/sellable-status.schema.json"
                          - type: object
                            required: [recall_case_open]
                            description: >-
                              The provider always emits recall_case_open on this read (true or false, never absent or null),
                              so a consumer may require it. The shared schema keeps it optional because the
                              ops-core.sellable.sku-became-* events do not carry it.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  headers:
    CorrelationId:
      description: >-
        The correlation id in effect for this request: the X-Correlation-Id of the request when it was valid, otherwise a UUID
        generated by the provider. Compare it with the one you sent before assuming it is yours.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9:_.-]{1,128}$" }
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >-
        Optional trace id: 1 to 128 characters of A-Z, a-z, 0-9, colon, underscore, dot and hyphen, counted after leading and
        trailing white space is trimmed. Absent, empty or malformed is not an error: the provider ignores the value, generates
        a UUID and uses that one, and the request is processed normally. The id in effect always comes back, in the
        X-Correlation-Id response header and in correlation.correlationId of the response body (error.correlationId of an
        error body); a consumer that sent a valid id gets the same id back, so compare it before assuming it is yours. Put
        nothing secret or personal in it. The same rule is in docs/correlation-audit-standard.md. On POST
        /v1/availability/check a correlation.correlationId in the request body that is sent together with this header must
        equal it exactly, otherwise the answer is 422 on the field correlation.correlationId.
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9:_.-]{1,128}$" }
  schemas:
    AvailabilityCheckRequest:
      type: object
      additionalProperties: false
      description: "Minimal v1 availability check request. TODO: replace with a dedicated schema if source docs later define quantity, channel, and reservation semantics."
      properties:
        sku_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
          description: Optional warehouse scope. FGSA-01 default availability scope is SKU + warehouse aggregate.
        batch_id:
          type: string
          format: uuid
        requested_quantity:
          $ref: "../../schemas/common/quantity.schema.json"
        uom_code:
          type: string
          enum: ["hộp", "thùng", "lọ", "hũ"]
          description: >-
            Optional. Supplying it makes the response carry the quantity block (uom_code, warehouse_scope,
            check_mode, available_quantity, sellable_quantity, fulfillable, resolved_at, valid_until);
            omitting it leaves the response byte-for-byte identical to the pre-2026-09-09 shape.
            Top-level rather than read off requested_quantity.unit because EXISTENCE mode asks "how much is
            there" without sending a quantity, so nothing else carries the unit. When both are supplied,
            requested_quantity.unit must equal uom_code exactly - a mismatch is 422, never a silent pick.
            Ordinal match: no case folding, no conversion, no mixed-UOM aggregation.
            Merged in from the retired POST /v2/availability/check under
            OWNER-DIRECTIVE-2026-09-09-AVAILABILITY-V1-ONLY.
        channel_context:
          $ref: "../../schemas/common/source-ref.schema.json"
        correlation:
          $ref: "../../schemas/common/correlation.schema.json"
      required: [sku_id]
    ErrorEnvelope:
      allOf:
        - $ref: "../../schemas/common/envelope.schema.json"
        - type: object
          properties:
            error:
              $ref: "../../schemas/common/error.schema.json"
  responses:
    BadRequest: { description: Bad request., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: Permission denied., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: State conflict or idempotency conflict., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    UnprocessableEntity: { description: Validation or guard failure., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    RateLimited:
      description: RATE_LIMITED; caller must honor Retry-After and the operation retry budget.
      x-error-code: RATE_LIMITED
      x-http-status: 429
      x-retryable: true
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalServerError: { description: Internal server error., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
