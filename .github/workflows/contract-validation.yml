name: Contract validation

on:
  pull_request:
    paths:
      - "asyncapi/**"
      - "compatibility/**"
      - "contract-tests/**"
      - "docs/**"
      - "enums/**"
      - "error-codes/**"
      - "events/**"
      - "examples/**"
      - "generated/**"
      - "openapi/**"
      - "schemas/**"
      - "scripts/**"
      - "state-machines/**"
  push:
    branches:
      - main
      - master

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Operational Forms v2 parity
        run: node scripts/validate-contracts.mjs --scope=operational-form-v2
      - name: Validate SKU lifecycle enum parity
        run: node scripts/validate-contracts.mjs --scope=sku-lifecycle
      - name: Validate external bulk-read v1 contracts
        run: node contract-tests/x03b/external-bulk-read-v1.contract.test.mjs
      - name: Validate complete contract baseline
        run: node scripts/validate-contracts.mjs
